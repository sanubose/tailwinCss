<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position tailwindcss </title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="bg-green-200 size-50 absolute top-0 left-0"></div>
    <div class="bg-green-400 size-50 absolute top-0 right-0"></div>
    <div class="bg-green-700 size-50 absolute bottom-0 left-0"></div>
    <div class="bg-green-900 size-50 absolute bottom-0 right-0"></div>
</body>
</html>
