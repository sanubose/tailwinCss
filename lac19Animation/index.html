<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation In tailwindcss </title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="size-25 bg-pink-500 p-4 mt-10 ml-10 animate-bounce  rounded-full "></div> <hr>


    <div class="size-25 bg-green-400 mt-20 ml-25 animate-spin"></div><hr/>

    <div class="size-25 bg-pink-500 p-4 mt-10 ml-10 animate-ping  rounded-full "></div>

    <div class="size-25 bg-pink-500 p-4 m-10 animate-plus  rounded-full "></div>
  
    
</body>
</html>
