<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filterClass In Tailwind CSS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
     
    <h1>Original Image:</h1>
    <img class=" w-40 h-40 m-5"src="tiger.jpg" alt="">

   
    <h1>Contrast</h1>

    <img  class="Contrast-0 m-5 h-40" src="tiger.jpg" alt="">
    <img  class="Contrast-50  m-5 h-40" src="tiger.jpg" alt="">
    <img  class=" Contrast-100 m-5 h-40" src="tiger.jpg" alt="">
    <img  class=" Contrast-150 m-5 h-40" src="tiger.jpg" alt="">
     <img  class=" Contrast-200  m-5 h-40" src="tiger.jpg" alt="">

    <h1>GrayScale:</h1>

    <img  class="grayscale m-5 h-40" src="tiger.jpg" alt="">
    <img  class="grayscale-25  m-5 h-40" src="tiger.jpg" alt="">
    <img  class="grayscale-50 m-5 h-40" src="tiger.jpg" alt="">
    <img  class="grayscale-75 m-5 h-40" src="tiger.jpg" alt="">
     <img  class="grayscale-100 m-5 h-40" src="tiger.jpg" alt="">

    <h1>Invert:</h1>
    <img  class="invert m-5 h-40" src="tiger.jpg" alt="">

    <h1>hue:</h1>
    <img  class="hue-rotate-15 m-5 h-40" src="tiger.jpg" alt="">
    <img  class="hue-rotate-30  m-5 h-40" src="tiger.jpg" alt="">
    <img  class="hue-rotate-60 m-5 h-40" src="tiger.jpg" alt="">
    <img  class="hue-rotate-75 m-5 h-40" src="tiger.jpg" alt="">
     <img  class="hue-rotate-90 m-5 h-40" src="tiger.jpg" alt="">
    
</body>
</html>
