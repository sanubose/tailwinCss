<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filterClass In Tailwind CSS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
     
    <h1>Original Image:</h1>
    <img class=" w-40 h-40"src="tiger.jpg" alt="">

    <h1> blurred Image:</h1>
    <img  class="blur w-40 h-40" src="tiger.jpg" alt="">
    
     <img  class="blur-sm w-40 h-40" src="tiger.jpg" alt="">
    <img  class="blur-md  w-40 h-40" src="tiger.jpg" alt="">
    <img  class="blur-lg  w-40 h-40" src="tiger.jpg" alt="">
    <img  class="blur-xl  w-40 h-40" src="tiger.jpg" alt="">

    <h1>brightness</h1>
    
</body>
</html>
